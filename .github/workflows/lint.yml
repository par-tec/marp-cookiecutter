---
# Run the SuperLinter action with some custom setup.
name: Lint
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      full_scan:
        type: boolean
        default: false
        required: false
        description: "Lint the whole codebase, not just changed
          files"
permissions:
  contents: read
jobs:
  super-linter:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        # Full git history is needed for super-linter to detect changed files.
        fetch-depth: 0
        persist-credentials: false
    - name: Load super-linter environment file
      run: |
        # Shared linter flags also used by docker-compose.yaml.
        if [ -f "./.github/super-linter.env" ]; then
          grep "\S" ./.github/super-linter.env | grep -v "^#" >> "$GITHUB_ENV"
        fi
    - name: Super-Linter
      uses: super-linter/super-linter@47984f49b4e87383eed97890fe2dca6063bbd9c3  # v8.3.1
      env:
        # To report GitHub Actions status checks.
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Lint only changed files unless dispatched with full_scan=true.
        VALIDATE_ALL_CODEBASE: ${{ inputs.full_scan || false }}
        DEFAULT_BRANCH: ${{ github.event.pull_request.base.ref
          || github.ref_name }}
  pre-commit:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container: python:3.12
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        # Remove git credentials to prevent
        #   credentials to be leaked on artifacts.
        persist-credentials: false
    - name: Run commit hooks.
      run: |
        pip3 --no-cache-dir install pre-commit
        git --version
        pwd
        ls -la
        id
        git config --global --add safe.directory "$PWD"
        pre-commit install
        pre-commit run -a --hook-stage pre-commit
    # Store (expiring) logs on failure.
    # Retrieve artifacts via `gh run download`.
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
      if: failure()
      with:
        name: pre-commit.log
        path: /github/home/.cache/pre-commit/pre-commit.log
        retention-days: 5
