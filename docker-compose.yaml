---
#
# Run this file using
#
# $ docker-compose up pre-commit
#
services:
  pre-commit:
    build:
      context: .
      dockerfile: pre-commit.dockerfile
    working_dir: /code
    volumes:
    - .:/code
  super-linter:
    image: super-linter/super-linter@47984f49b4e87383eed97890fe2dca6063bbd9c3  # v8.3.1
    # Shared linter flags live in .github/super-linter.env (also used by CI).
    env_file:
    - .github/super-linter.env
    environment:
    - RUN_LOCAL=true  # local-only; do not move to the shared env file
    volumes:
    - .:/tmp/lint/
  # This container will run successfully
  # only if all dependencies return no errors.
  test:
    image: busybox
    depends_on:
      pre-commit:
        condition: service_completed_successfully
      super-linter:
        condition: service_completed_successfully
